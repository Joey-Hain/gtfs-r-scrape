name: Collect bus positions

# GitHub's scheduler is unreliable: even this hourly schedule only fires every
# few hours in practice. So each run stays up for 55 minutes, taking a snapshot
# every 5 minutes (:02, :07 ... :57; see collector.py --minutes), then commits
# once. Each start that does happen yields ~11 snapshots instead of one.
on:
  schedule:
    - cron: '2 * * * *'
  workflow_dispatch:    # also allow manual trigger from the Actions tab
    inputs:
      minutes:
        description: 'How long to keep collecting (0 = single snapshot)'
        default: '55'

# Never run two collectors at once; a late start queues behind the current one
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    permissions:
      contents: write         # needed to push the CSV commit back to the repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests gtfs-realtime-bindings tzdata

      - name: Run collector
        env:
          TFNSW_API_KEY: ${{ secrets.TFNSW_API_KEY }}
          MINUTES: ${{ github.event.inputs.minutes || '55' }}
          # TFNSW_VEHICLE_POS_URL is optional; collector.py defaults to the buses endpoint
          COLLECTOR_INTERVAL_MIN: '5'   # minutes between snapshots
          COLLECTOR_OFFSET_MIN: '2'     # :02, :07 ... avoids the home collector's :00/:15/:30/:45
        run: python collector.py --minutes "$MINUTES"

      - name: Commit and push data
        if: success() || failure()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          # Only commit if something actually changed (skips empty runs gracefully)
          git diff --cached --quiet && exit 0
          git commit -m "data: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          # data-local/ pushes from the home collector may have landed meanwhile
          for i in 1 2 3; do
            git pull --rebase -q && git push -q && exit 0
            sleep 5
          done
          exit 1
